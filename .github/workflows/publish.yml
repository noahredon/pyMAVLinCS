name: Publish pyMAVLinCS to PyPI and Update Docs

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag is on main branch
        run: |
          git fetch origin main
          if ! git branch -r --contains ${{ github.sha }} | grep -q 'origin/main'; then
            echo "Error: The tagged commit is not on the main branch! Publishing is restricted to main."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          twine upload dist/*

  # -------------------------------------------------------------
  # Job automatique : Génération et mise à jour de la documentation
  # -------------------------------------------------------------
  update-documentation:
    needs: build-and-publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pyMAVLinCS (library)
        uses: actions/checkout@v4
        with:
          path: pyMAVLinCS

      - name: Checkout pyMAVLinCS-documentation
        uses: actions/checkout@v4
        with:
          repository: noahredon/pyMAVLinCS-documentation
          token: ${{ secrets.DOCS_PAT }}
          path: pyMAVLinCS-documentation

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install library and Sphinx dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ./pyMAVLinCS
          pip install sphinx sphinx_rtd_theme sphinx_autodoc_typehints

      - name: Generate documentation with auto_doc.py
        working-directory: pyMAVLinCS-documentation
        run: |
          python auto_doc.py --source-dir ../pyMAVLinCS/pyMAVLinCS

      - name: Commit, tag and push to pyMAVLinCS-documentation
        working-directory: pyMAVLinCS-documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add build/ documentation.html
          if git diff --staged --quiet; then
            echo "Aucun changement dans la doc HTML."
          else
            git commit -m "Release ${{ github.ref_name }}"
            git tag ${{ github.ref_name }}
            git push origin main --tags
          fi
